name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q
      - name: Smoke run on synthetic data
        run: python scripts/run_pipeline.py --synthetic --fast --n-dates 200 --out results
